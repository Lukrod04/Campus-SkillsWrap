{% extends 'base.html' %}
{% block content %}
<section class="card p-4 mx-auto form-panel">
  <h1 class="h3">Welcome back</h1><p>Log in to share, connect, and learn.</p>
  <form method="post">{% csrf_token %}{{ form.as_p }}<input type="hidden" name="next" value="{{ next }}"><button class="btn btn-primary">Log in</button></form>
  <p class="mt-3 mb-0">New here? <a href="{% url 'register' %}">Create an account</a>.</p>
</section>
{% endblock %}
