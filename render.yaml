# Deploy with this folder as the repository root.
# A paid persistent disk is necessary to retain SQLite records.
services:
  - type: web
    name: campus-skillswap
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements-production.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py seed_skills && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --access-logfile -
    disk:
      name: skillswap-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.12
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: SQLITE_PATH
        value: /var/data/db.sqlite3
